name: Build experimental Credential Provider

on:
  push:
    branches:
      - experimental/credential-provider-v2
    paths:
      - "src/BDFR.LogonUI.CredentialProvider/**"
      - "scripts/credential-provider-vm/**"
      - "docs/CREDENTIAL_PROVIDER_VM.md"
      - ".github/workflows/build-credential-provider.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/BDFR.LogonUI.CredentialProvider/**"
      - "scripts/credential-provider-vm/**"
      - "docs/CREDENTIAL_PROVIDER_VM.md"
      - ".github/workflows/build-credential-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdfr-logonui-cp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release DLL
        shell: pwsh
        run: |
          $args = @(
            "src/BDFR.LogonUI.CredentialProvider/BDFR.LogonUI.CredentialProvider.vcxproj",
            "/m",
            "/p:Configuration=Release",
            "/p:Platform=x64"
          )
          msbuild @args

      - name: Validate COM exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path src/BDFR.LogonUI.CredentialProvider -Filter BDFR.LogonUI.CredentialProvider.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "Credential Provider DLL was not produced." }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          $exports = & $dumpbin.Source /exports $dll.FullName | Out-String
          if ($exports -notmatch "DllGetClassObject") { throw "DllGetClassObject export is missing." }
          if ($exports -notmatch "DllCanUnloadNow") { throw "DllCanUnloadNow export is missing." }
          "CP_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage VM-only package
        shell: pwsh
        run: |
          $stage = "artifacts/BDFR_LogonUI_CredentialProvider_VMPreview"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $env:CP_DLL "$stage/BDFR.LogonUI.CredentialProvider.dll" -Force
          Copy-Item scripts/credential-provider-vm/*.ps1 $stage -Force
          Copy-Item docs/CREDENTIAL_PROVIDER_VM.md "$stage/VM-TESTING.md" -Force
          Copy-Item src/BDFR.LogonUI.CredentialProvider/README.md "$stage/README.md" -Force

      - name: Upload VM preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_LogonUI_CredentialProvider_VMPreview-x64
          path: artifacts/BDFR_LogonUI_CredentialProvider_VMPreview
          if-no-files-found: error
          retention-days: 14
