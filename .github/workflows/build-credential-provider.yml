name: Build experimental Credential Provider

on:
  push:
    branches:
      - experimental/credential-provider-v2
    paths:
      - "src/BDFR.LogonUI.CredentialProvider/**"
      - "scripts/credential-provider-vm/**"
      - "scripts/credential-provider-physical-lab/**"
      - "scripts/credential-provider-true-lock/**"
      - "docs/CREDENTIAL_PROVIDER_VM.md"
      - ".github/workflows/build-credential-provider.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/BDFR.LogonUI.CredentialProvider/**"
      - "scripts/credential-provider-vm/**"
      - "scripts/credential-provider-physical-lab/**"
      - "scripts/credential-provider-true-lock/**"
      - "docs/CREDENTIAL_PROVIDER_VM.md"
      - ".github/workflows/build-credential-provider.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bdfr-logonui-cp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release DLL
        shell: pwsh
        run: |
          $args = @(
            "src/BDFR.LogonUI.CredentialProvider/BDFR.LogonUI.CredentialProvider.vcxproj",
            "/m",
            "/p:Configuration=Release",
            "/p:Platform=x64"
          )
          msbuild @args

      - name: Validate COM exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path src/BDFR.LogonUI.CredentialProvider -Filter BDFR.LogonUI.CredentialProvider.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "Credential Provider DLL was not produced." }

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }

            $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsInstall) { throw "Visual Studio C++ tools installation was not found." }

            $dumpbinPath = Get-ChildItem -Path (Join-Path $vsInstall "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse |
              Where-Object { $_.FullName -match "\\bin\\Hostx64\\x64\\dumpbin.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $dumpbinPath) { throw "dumpbin.exe was not found in Visual Studio C++ tools." }
            $dumpbinExe = $dumpbinPath.FullName
          }
          else {
            $dumpbinExe = $dumpbin.Source
          }

          $exports = & $dumpbinExe /exports $dll.FullName | Out-String
          if ($exports -notmatch "DllGetClassObject") { throw "DllGetClassObject export is missing." }
          if ($exports -notmatch "DllCanUnloadNow") { throw "DllCanUnloadNow export is missing." }
          "CP_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate True Lock PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/credential-provider-true-lock/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { throw "True Lock PowerShell syntax validation failed." }

      - name: Stage VM-only package
        shell: pwsh
        run: |
          $stage = "artifacts/BDFR_LogonUI_CredentialProvider_VMPreview"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $env:CP_DLL "$stage/BDFR.LogonUI.CredentialProvider.dll" -Force
          Copy-Item scripts/credential-provider-vm/*.ps1 $stage -Force
          Copy-Item docs/CREDENTIAL_PROVIDER_VM.md "$stage/VM-TESTING.md" -Force
          Copy-Item src/BDFR.LogonUI.CredentialProvider/README.md "$stage/README.md" -Force

      - name: Stage physical-lab package
        shell: pwsh
        run: |
          $stage = "artifacts/BDFR_LogonUI_CredentialProvider_PhysicalLab"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $env:CP_DLL "$stage/BDFR.LogonUI.CredentialProvider.dll" -Force
          Copy-Item scripts/credential-provider-physical-lab/*.ps1 $stage -Force
          Copy-Item src/BDFR.LogonUI.CredentialProvider/README.md "$stage/README.md" -Force

          @"
          BDFR LogonUI Credential Provider — Physical Lab Preview

          PREVIEW ONLY. This provider does not authenticate yet.
          Keep Microsoft Password/PIN/Windows Hello providers enabled.

          Recommended order:
          1. Run Test-BDFRPhysicalPreflight.ps1 as Administrator.
          2. Confirm the machine is suitable for the physical-lab test.
          3. Register with Register-BDFRProvider-PhysicalLab.ps1.
          4. Use SIGN OUT for the first test. Do not reboot first.
          5. The default auto rollback is 15 minutes.

          All files in this folder are intended to stay together.
          "@ | Set-Content -Path "$stage/PHYSICAL-LAB-README.txt" -Encoding utf8

      - name: Stage True Lock package
        shell: pwsh
        run: |
          $stage = "artifacts/BDFR_LogonUI_TrueLock"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $env:CP_DLL "$stage/BDFR.LogonUI.CredentialProvider.dll" -Force
          Copy-Item scripts/credential-provider-true-lock/*.ps1 $stage -Force

          @"
          BDFR LogonUI — TRUE LOCK TEST PACKAGE

          This package connects the installed BDFR experience to Windows LogonUI.
          Install the latest BDFR_LogonUI_Setup.exe first so this file exists:
          C:\Program Files\BDFR\LogonUI\BDFR.LogonUI.Demo.exe

          Then run Test-BDFRTrueLockPreflight.ps1 and Install-BDFRTrueLock.ps1
          from an elevated PowerShell window.

          Windows built-in Password/PIN/Hello providers are not removed.
          The initial test has an automatic rollback.
          "@ | Set-Content -Path "$stage/TRUE-LOCK-README.txt" -Encoding utf8

      - name: Upload VM preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_LogonUI_CredentialProvider_VMPreview-x64
          path: artifacts/BDFR_LogonUI_CredentialProvider_VMPreview
          if-no-files-found: error
          retention-days: 14

      - name: Upload physical-lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_LogonUI_CredentialProvider_PhysicalLab-x64
          path: artifacts/BDFR_LogonUI_CredentialProvider_PhysicalLab
          if-no-files-found: error
          retention-days: 14

      - name: Upload True Lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_LogonUI_TrueLock-x64
          path: artifacts/BDFR_LogonUI_TrueLock
          if-no-files-found: error
          retention-days: 14

      - name: Prepare True Lock release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental/credential-provider-v2'
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=8 HEAD).Trim()
          $tag = "true-lock-${{ github.run_number }}-$shortSha"
          $zip = "artifacts/BDFR_LogonUI_TrueLock-$tag-x64.zip"
          $hashFile = "artifacts/BDFR_LogonUI_TrueLock-$tag-x64.sha256.txt"

          Compress-Archive -Path "artifacts/BDFR_LogonUI_TrueLock/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path $hashFile -Encoding ascii

          "TRUE_LOCK_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRUE_LOCK_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRUE_LOCK_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish True Lock prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental/credential-provider-v2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:TRUE_LOCK_TAG" `
            "$env:TRUE_LOCK_ZIP" `
            "$env:TRUE_LOCK_HASH" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "BDFR LogonUI True Lock #${{ github.run_number }}" `
            --notes "Experimental True Lock package: Credential Provider + secure-lock installer/rollback scripts. Install the latest BDFR LogonUI Setup first. Built-in Windows Password/PIN/Hello providers remain available." `
            --prerelease
